<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE BARBER CUT - VIP Booking App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html2canvas for Download Receipt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Tesseract.js for OCR Screenshot Analysis -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    /* Feature 3: Screen Lock & Pinch Zoom Prevention */
    html, body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      background-color: #0d0d0d;
      color: #f3f4f6;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Gold VIP Styling */
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-border {
      border-color: #D4AF37;
    }

    .gold-btn {
      background: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
      color: #000;
      font-weight: 700;
    }

    .gold-btn:hover {
      background: linear-gradient(135deg, #FFA751 0%, #FFE259 100%);
    }

    /* VIP Receipt Styling */
    .receipt-card {
      background: radial-gradient(circle at top right, #1f1f1f, #0a0a0a);
      border: 2px solid #D4AF37;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.25);
    }
    
    /* Scanner Animation */
    .scan-line {
      height: 2px;
      background: #D4AF37;
      box-shadow: 0 0 15px #D4AF37;
      animation: scan 2s infinite ease-in-out;
    }
    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

  <!-- APP HEADER / BANNER -->
  <header class="bg-black border-b border-yellow-600/30 sticky top-0 z-40 shadow-lg">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Banner DP Logo -->
        <div class="w-12 h-12 rounded-full border-2 border-yellow-500 overflow-hidden bg-neutral-800 flex items-center justify-center font-bold text-yellow-500 text-xl shadow-md">
          TBC
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-wider gold-gradient-text">THE BARBER CUT</h1>
          <p class="text-xs text-gray-400 flex items-center gap-1">
            <i data-lucide="clock" class="w-3 h-3 text-yellow-500"></i> 8:00 AM - 8:00 PM (Thu Closed)
          </p>
        </div>
      </div>
      <button onclick="toggleAdminModal()" class="text-xs bg-neutral-900 border border-yellow-500/50 text-yellow-500 px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-yellow-500 hover:text-black transition">
        <i data-lucide="shield-check" class="w-4 h-4"></i> Admin
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-xl mx-auto w-full px-4 pt-4 flex-1">

    <!-- SHOP DETAILS & QUICK CONTACT CARD (Feature 1 & 14) -->
    <div class="bg-neutral-900/80 border border-neutral-800 rounded-xl p-4 mb-5 shadow-lg backdrop-blur">
      <div class="flex justify-between items-start mb-3">
        <div>
          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-yellow-500/10 text-yellow-500 border border-yellow-500/30">VIP SALON</span>
          <p class="text-sm text-gray-300 mt-1">Premium Grooming & Style Studio</p>
        </div>
        <div class="flex gap-2">
          <!-- Instagram Link -->
          <a href="https://instagram.com" target="_blank" class="p-2 rounded-lg bg-neutral-800 border border-neutral-700 text-pink-500 hover:scale-105 transition">
            <i data-lucide="instagram" class="w-5 h-5"></i>
          </a>
          <!-- Google Maps Location -->
          <a href="https://maps.google.com" target="_blank" class="p-2 rounded-lg bg-neutral-800 border border-neutral-700 text-green-500 hover:scale-105 transition">
            <i data-lucide="map-pin" class="w-5 h-5"></i>
          </a>
        </div>
      </div>

      <!-- Support Contacts -->
      <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-neutral-800 text-gray-400">
        <div class="flex items-center gap-1.5">
          <i data-lucide="phone" class="w-3.5 h-3.5 text-yellow-500"></i>
          <span>Support: <b>9122039395</b></span>
        </div>
        <div class="flex items-center gap-1.5">
          <i data-lucide="wallet" class="w-3.5 h-3.5 text-yellow-500"></i>
          <span>UPI: <b>9130346008</b></span>
        </div>
      </div>
    </div>

    <!-- VIEW PERSISTENCE SWITCHER: FORM vs RECEIPT -->
    <div id="bookingSection" class="space-y-5">

      <!-- SERVICE & CUSTOMER DETAILS FORM -->
      <div class="bg-neutral-900
